<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Linux systemd 守护与健康检查示意图</title>
  <desc id="desc">创建 systemd 服务、启动守护进程并使用日志检查运行状态。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f7ff"/><stop offset="1" stop-color="#eefbf7"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#163451" flood-opacity=".14"/></filter></defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <rect x="54" y="48" width="1092" height="284" rx="18" fill="#101a2b" filter="url(#shadow)"/><rect x="54" y="48" width="1092" height="46" rx="18" fill="#192a42"/><text x="86" y="78" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" fill="#c6d4e9">root@ubuntu · systemd</text>
  <text x="88" y="136" font-family="Cascadia Mono,Consolas,monospace" font-size="17" fill="#9bb0ca">$ </text><text x="122" y="136" font-family="Cascadia Mono,Consolas,monospace" font-size="17" fill="#fff">sudo systemctl daemon-reload</text>
  <text x="88" y="178" font-family="Cascadia Mono,Consolas,monospace" font-size="17" fill="#9bb0ca">$ </text><text x="122" y="178" font-family="Cascadia Mono,Consolas,monospace" font-size="17" fill="#fff">sudo systemctl enable --now mengka-nt</text>
  <text x="88" y="220" font-family="Cascadia Mono,Consolas,monospace" font-size="17" fill="#9bb0ca">$ </text><text x="122" y="220" font-family="Cascadia Mono,Consolas,monospace" font-size="17" fill="#fff">sudo systemctl status mengka-nt</text>
  <rect x="88" y="246" width="990" height="56" rx="9" fill="#153c31"/><text x="112" y="281" font-family="Cascadia Mono,Consolas,monospace" font-size="16" fill="#7ef0ad">● mengka-nt.service · active (running) · Main PID 3142</text>
  <rect x="54" y="370" width="520" height="276" rx="18" fill="#fff" filter="url(#shadow)"/><text x="90" y="420" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#17233a">验证日志与自动重启</text><text x="90" y="456" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" fill="#64748b">出现异常时先看最近 100 行日志。</text><rect x="90" y="492" width="446" height="88" rx="10" fill="#f4f7fb"/><text x="112" y="528" font-family="Cascadia Mono,Consolas,monospace" font-size="15" fill="#233b60">journalctl -u mengka-nt</text><text x="112" y="556" font-family="Cascadia Mono,Consolas,monospace" font-size="15" fill="#233b60">-n 100 --no-pager</text><rect x="90" y="596" width="218" height="28" rx="8" fill="#e8f8ef"/><text x="106" y="616" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13" fill="#19794c">看到 WebUI ready 即成功</text>
  <rect x="622" y="370" width="524" height="276" rx="18" fill="#fff" filter="url(#shadow)"/><text x="658" y="420" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#17233a">上线前的最小安全配置</text><text x="658" y="462" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" fill="#64748b">管理端口只监听本机，再由 Nginx 提供 HTTPS。</text><text x="658" y="512" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#2b4d7d">✓ 监听 127.0.0.1</text><text x="658" y="548" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#2b4d7d">✓ 保留 WebSocket Upgrade</text><text x="658" y="584" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#2b4d7d">✓ 防火墙只放 80/443</text><text x="658" y="620" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#2b4d7d">✓ 管理员账号本地保存</text>
</svg>
