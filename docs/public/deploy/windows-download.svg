<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Windows 下载、解压与启动示意图</title>
  <desc id="desc">浏览器打开 GitHub Release，PowerShell 解压并启动萌卡 NT。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef4ff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17315c" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <rect x="42" y="36" width="1116" height="310" rx="18" fill="#fff" filter="url(#shadow)"/>
  <rect x="42" y="36" width="1116" height="48" rx="18" fill="#f4f7fb"/>
  <circle cx="72" cy="60" r="7" fill="#ff6b6b"/><circle cx="96" cy="60" r="7" fill="#ffc857"/><circle cx="120" cy="60" r="7" fill="#3ecf8e"/>
  <rect x="166" y="49" width="900" height="24" rx="12" fill="#e7edf6"/>
  <text x="190" y="66" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#607089">github.com/Carlor-Official/Mengka-NT/releases/tag/v2.4.1</text>
  <text x="82" y="132" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#17233a">萌卡 NT v2.4.1 · Assets</text>
  <text x="82" y="164" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#64748b">Windows 64 位请选择带有 windows-amd64 的压缩包</text>
  <rect x="82" y="198" width="1036" height="58" rx="12" fill="#f8fafc" stroke="#d7e1ef"/>
  <circle cx="112" cy="227" r="16" fill="#2f73ff"/><text x="106" y="233" font-family="Arial" font-size="16" font-weight="700" fill="#fff">↓</text>
  <text x="146" y="221" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#22314d">mengka-nt-2.4.1-windows-amd64.zip</text>
  <text x="146" y="243" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13" fill="#718096">下载后放到一个新的空目录，例如 C:\\MengkaNT</text>
  <rect x="82" y="274" width="1036" height="42" rx="10" fill="#e9f2ff"/>
  <text x="104" y="301" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#2f5f9e">同时下载 SHA256SUMS.txt，校验通过后再解压运行。</text>
  <rect x="42" y="380" width="1116" height="294" rx="18" fill="#101a2b" filter="url(#shadow)"/>
  <rect x="42" y="380" width="1116" height="46" rx="18" fill="#18263e"/>
  <text x="76" y="409" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" fill="#b8c7dd">Windows PowerShell</text>
  <circle cx="1090" cy="403" r="5" fill="#4ade80"/><circle cx="1110" cy="403" r="5" fill="#facc15"/>
  <text x="82" y="474" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#9fb4d0">PS C:\\&gt; </text>
  <text x="184" y="474" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#f7fbff">Expand-Archive .\\mengka-nt-2.4.1-windows-amd64.zip .\\mengka-nt</text>
  <text x="82" y="520" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#9fb4d0">PS C:\\&gt; </text>
  <text x="184" y="520" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#f7fbff">cd .\\mengka-nt</text>
  <text x="82" y="566" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#9fb4d0">PS C:\\MengkaNT\\mengka-nt&gt; </text>
  <text x="386" y="566" font-family="Cascadia Mono,Consolas,monospace" font-size="18" fill="#f7fbff">.\\mengka-nt.exe</text>
  <rect x="82" y="600" width="920" height="38" rx="8" fill="#163d31"/>
  <text x="104" y="625" font-family="Cascadia Mono,Consolas,monospace" font-size="15" fill="#75e3a8">WebUI ready · 打开终端显示的 http://127.0.0.1:端口/ 地址</text>
</svg>
